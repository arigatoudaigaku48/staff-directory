<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
    :root{--orange:#ffb347;--dark:#f57c00;--deep:#e65100;--light:#fff3e0;--text:#333;--gray:#757575;--red:#d84315}
    *{box-sizing:border-box}body{margin:0;background:#f9f3ee;color:var(--text);font-family:'Zen Maru Gothic',sans-serif}
    .header{background:linear-gradient(135deg,#ffa726,#f57c00);padding:24px 16px;text-align:center;color:#fff;box-shadow:0 2px 12px #f57c004d}
    .header h1{font-size:20px;margin:0 0 6px}.header p{font-size:12px;margin:0;opacity:.9}
    main{max-width:680px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 20px #ffb34726}
    .title{font-weight:700;color:var(--deep);margin-bottom:14px}.field{margin-bottom:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
    .required{font-size:10px;color:#fff;background:var(--dark);border-radius:5px;padding:1px 5px}
    input,textarea{width:100%;border:1px solid #ead9c7;border-radius:10px;padding:11px;font:inherit;font-size:14px;outline:none}input:focus,textarea:focus{border-color:var(--orange)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .choice input{display:none}.choice label{margin:0;padding:10px;text-align:center;border:1px solid #ffd59f;border-radius:10px;background:#fffaf4;cursor:pointer}
    .choice input:checked+label{background:var(--orange);color:#fff;border-color:var(--dark)}.hint{font-size:10px;color:var(--gray);margin:4px 0 0}
    .details{display:none}.details.active{display:block}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips label{font-weight:500;border:1px solid #ffd59f;padding:6px 9px;border-radius:9px;cursor:pointer}.chips input{display:none}.chips input:checked+label{background:var(--light);color:var(--deep);border-color:var(--orange)}
    button{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,#ffa726,#f57c00);color:#fff;box-shadow:0 4px 14px #f57c0040}.secondary{background:#fff;color:var(--red);border:1px solid #ffccbc}.nav{display:block;text-align:center;color:var(--deep);font-size:13px;margin:16px}
    .message{display:none;text-align:center;padding:25px}.account{font-size:11px;color:var(--gray);text-align:center;margin-bottom:12px}.error{color:var(--red);font-size:12px;text-align:center;margin:8px}.danger{border-top:1px dashed #ffd0bd;padding-top:16px;margin-top:16px}.danger p{font-size:11px;color:var(--gray)}
    button:disabled{opacity:.55;cursor:wait}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}main{padding:12px}.card{padding:15px}}
  </style>
</head>
<body>
  <header class="header"><h1>🌸 担当者登録フォーム</h1><p>担当業務の情報を登録してください</p></header>
  <main>
    <div id="account" class="account">Googleアカウントを確認中…</div>
    <form id="mainForm">
      <section class="card">
        <div class="title">基本情報</div>
        <div class="field"><label>店舗コード <span class="required">必須</span></label><input id="storeCode" required inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="例：0001"><p class="hint">加盟順の4桁コードを入力してください</p></div>
        <div class="field"><label>店舗名 <span class="required">必須</span></label><input id="store" required placeholder="例：ありがとうエアコンお掃除専門店"></div>
        <div class="field"><label>店舗での役割 <span class="required">必須</span></label><div class="grid"><div class="choice"><input type="radio" name="role" id="roleOwner" value="オーナー"><label for="roleOwner">🏢 オーナー</label></div><div class="choice"><input type="radio" name="role" id="roleChief" value="事務長"><label for="roleChief">👑 事務長</label></div><div class="choice" style="grid-column:span 2"><input type="radio" name="role" id="roleStaff" value="一般担当者" checked><label for="roleStaff">一般担当者</label></div></div></div>
        <div class="field"><label>担当者名 <span class="required">必須</span></label><div class="two"><input id="lastName" required placeholder="姓"><input id="firstName" required placeholder="名"></div></div>
        <div class="field"><label>ふりがな <span class="required">必須</span></label><div class="two"><input id="lastNameKana" required placeholder="せい"><input id="firstNameKana" required placeholder="めい"></div></div>
        <div class="field"><label>担当略称 <span class="required">必須</span></label><input id="ryakusho" required placeholder="例：はな"><p class="hint">予約表に表示される名前</p></div>
        <div class="field"><label>Gmailアドレス <span class="required">必須</span></label><input id="gmail" type="email" required readonly></div>
        <div class="field"><label>LINE友達追加リンク</label><input id="lineLink" type="url" placeholder="https://line.me/ti/p/XXXXXXXX"></div>
      </section>

      <section class="card"><div class="title">担当カテゴリ（複数選択可）</div><div class="grid" id="categories"></div></section>
      <div id="detail-yoyaku" class="card details"><div class="title">予約詳細</div><div class="chips" data-detail="予約"><input id="ym1" type="checkbox" value="ユアマイスター（関東）"><label for="ym1">ユアマイスター 関東</label><input id="ym2" type="checkbox" value="ユアマイスター（関西）"><label for="ym2">ユアマイスター 関西</label><input id="mm1" type="checkbox" value="ミツモア（関東）"><label for="mm1">ミツモア 関東</label><input id="km" type="checkbox" value="くらしのマーケット"><label for="km">くらしのマーケット</label><input id="own" type="checkbox" value="自社"><label for="own">自社</label></div></div>
      <div id="detail-keiri" class="card details"><div class="title">経理詳細</div><div class="chips" data-detail="経理"><input id="k1" type="checkbox" value="売上登録"><label for="k1">売上登録</label><input id="k2" type="checkbox" value="他社間請求"><label for="k2">他社間請求</label><input id="k3" type="checkbox" value="報酬計算"><label for="k3">報酬計算</label><input id="k4" type="checkbox" value="作業完了報告"><label for="k4">作業完了報告</label></div></div>
      <div id="detail-claim" class="card details"><div class="title">クレーム詳細</div><div class="chips" data-detail="クレーム"><input id="c1" type="checkbox" value="エアコン関連クレーム"><label for="c1">エアコン関連</label><input id="c2" type="checkbox" value="お客様クレーム"><label for="c2">お客様対応</label></div></div>
      <div id="detail-somu" class="card details"><div class="title">総務詳細</div><div class="chips" data-detail="総務"><input id="s1" type="checkbox" value="シフト反映"><label for="s1">シフト反映</label><input id="s2" type="checkbox" value="名刺発注"><label for="s2">名刺発注</label><input id="s3" type="checkbox" value="ナノソル発注"><label for="s3">ナノソル発注</label></div></div>
      <section class="card"><div class="title">曜日・備考（任意）</div><textarea id="schedule" rows="3" placeholder="例：月水金担当"></textarea></section>
      <button class="primary" id="submitBtn" type="submit">✨ 登録する</button>
    </form>
    <div id="message" class="card message"></div>
    <section class="card danger"><div class="title">退社手続き</div><p>ログイン中のGoogleアカウントと一致する自分の在籍データだけを退社に変更します。</p><button type="button" class="secondary" id="selfRetire">本人として退社する</button></section>
    <a class="nav" href="?page=list">担当者一覧を見る →</a><div id="error" class="error"></div>
  </main>
  <script>
    const categoryDefs=[['予約','📅'],['経理','💰'],['オーナー','👑'],['指導者','📚'],['クレーム','📞'],['総務','🗂️'],['案件共有','📢'],['当日トラブル','🚨']];
    const detailsMap={予約:'yoyaku',経理:'keiri',クレーム:'claim',総務:'somu'};
    const categories=document.getElementById('categories');
    categoryDefs.forEach(([name,icon],i)=>{categories.insertAdjacentHTML('beforeend',`<div class="choice"><input type="checkbox" id="cat${i}" value="${name}"><label for="cat${i}">${icon} ${name}</label></div>`)});
    categories.addEventListener('change',()=>Object.entries(detailsMap).forEach(([name,id])=>document.getElementById('detail-'+id).classList.toggle('active',[...categories.querySelectorAll('input:checked')].some(x=>x.value===name))));
    const fail=e=>{document.getElementById('error').textContent=(e&&e.message)||String(e);enableButtons()};
    function enableButtons(){document.querySelectorAll('button').forEach(b=>b.disabled=false)}
    google.script.run.withSuccessHandler(s=>{document.getElementById('account').textContent=s.signedIn?`ログイン中: ${s.email}`:'Googleアカウントを確認できません';document.getElementById('gmail').value=s.email||''}).withFailureHandler(fail).getSessionInfo();
    document.getElementById('mainForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('submitBtn').disabled=true;document.getElementById('error').textContent='';const payload={};['storeCode','store','lastName','firstName','lastNameKana','firstNameKana','ryakusho','gmail','lineLink','schedule'].forEach(id=>payload[id]=document.getElementById(id).value);payload.role=document.querySelector('[name="role"]:checked').value;payload.categories=[...categories.querySelectorAll('input:checked')].map(x=>x.value);payload.details=[...document.querySelectorAll('[data-detail] input:checked')].map(x=>x.value).join('・');google.script.run.withSuccessHandler(()=>{document.getElementById('mainForm').style.display='none';const m=document.getElementById('message');m.style.display='block';m.innerHTML='<div style="font-size:36px">🌸</div><b>登録が完了しました！</b>'}).withFailureHandler(fail).registerStaff(payload)});
    document.getElementById('selfRetire').addEventListener('click',()=>{if(!confirm('自分の登録を「退社」に変更します。よろしいですか？'))return;document.getElementById('selfRetire').disabled=true;google.script.run.withSuccessHandler(()=>{alert('退社手続きが完了しました。');location.href='?page=list'}).withFailureHandler(fail).retireSelf()});
  </script>
</body>
</html>
