<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
:root{--orange:#ffb347;--dark:#f57c00;--deep:#e65100;--light:#fff3e0;--gray:#757575;--text:#333;--red:#d84315;--green:#2e7d32}*{box-sizing:border-box}body{margin:0;background:#f9f3ee;color:var(--text);font-family:'Zen Maru Gothic',sans-serif}.header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#ffa726,#f57c00);padding:16px;box-shadow:0 2px 12px #f57c004d;color:#fff}.top{display:flex;align-items:center;gap:8px;max-width:900px;margin:auto}.top h1{font-size:18px;margin:0;flex:1}.admin-badge{display:none;font-size:11px;background:#fff;color:var(--deep);padding:5px 9px;border-radius:14px}.search{max-width:900px;margin:10px auto 8px}.search input{width:100%;border:0;border-radius:20px;padding:10px 14px;font:inherit;outline:none}.filters,.tabs{display:flex;gap:6px;overflow:auto;max-width:900px;margin:auto}.chip,.tab{flex:0 0 auto;border:1px solid #ffffff80;background:#ffffff33;color:#fff;border-radius:18px;padding:5px 11px;font:inherit;font-size:11px;cursor:pointer}.chip.active,.tab.active{background:#fff;color:var(--deep);font-weight:700}.tabs{margin-bottom:8px}.tab{font-size:13px}.content{max-width:900px;margin:auto;padding:16px}.store{margin-bottom:20px}.store-head{display:flex;align-items:center;padding:9px 13px;color:#fff;background:linear-gradient(135deg,#ffa726,#f57c00);border-radius:12px;margin-bottom:9px;box-shadow:0 4px 16px #ffb34740}.store-head h2{font-size:14px;margin:0;flex:1}.store-code{font-size:10px;opacity:.8;margin-right:8px}.count{font-size:10px;background:#ffffff33;border-radius:10px;padding:2px 8px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 10px #00000010;border:2px solid transparent}.card.has-line{border-color:#ffe0b2}.card.role-owner{background:linear-gradient(145deg,#e4f7ff,#c8ebfb);border-color:#6fc7e8}.card.role-chief{background:linear-gradient(145deg,#fff0f6,#ffd6e8);border-color:#f48fb1}.card.retired{opacity:.78;border-color:#ddd}.role-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;margin-bottom:6px}.role-owner .role-badge{background:#4aaed4;color:#fff}.role-chief .role-badge{background:#e85d93;color:#fff}.name{font-size:13px;font-weight:700}.kana{font-size:10px;color:var(--gray);margin-bottom:5px}.short{display:inline-block;font-size:11px;font-weight:700;color:var(--deep);background:var(--light);padding:2px 8px;border-radius:8px}.tags{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0}.tag{font-size:10px;padding:2px 6px;border-radius:6px;background:#fff3e0;color:#e65100}.schedule,.retire-info{font-size:10px;color:var(--gray);line-height:1.4;margin:6px 0}.line{display:block;text-align:center;background:#06c755;color:#fff;border-radius:8px;padding:7px;text-decoration:none;font-size:12px;font-weight:700}.no-line{background:#f5f5f5;color:#bbb}.admin-action{display:none;width:100%;margin-top:7px;border:0;border-radius:8px;padding:7px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}.admin-mode .admin-action{display:block}.retire{background:#ffebee;color:var(--red)}.restore{background:#e8f5e9;color:var(--green)}.empty,.loading{text-align:center;color:var(--gray);padding:50px 10px}.footer{text-align:center;padding:5px 0 25px}.footer a{color:var(--deep);font-size:13px}.error{color:var(--red);text-align:center}.account{font-size:10px;opacity:.9}@media(min-width:700px){.cards{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header class="header"><div class="top"><h1>🌸 担当者一覧</h1><span id="adminBadge" class="admin-badge">管理者モード</span><span id="account" class="account"></span></div><div class="search"><input id="search" placeholder="🔎 名前・店舗・担当業務で検索"></div><div class="tabs"><button class="tab active" data-status="在籍">在籍</button><button class="tab" data-status="退社">退社</button></div><div id="filters" class="filters"></div></header>
<main id="content" class="content"><div class="loading">読み込み中…</div></main><footer class="footer"><a href="?page=register">← 登録・本人退社フォーム</a></footer>
<script>
let all=[],status='在籍',category='すべて',isAdmin=false;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function fail(e){$('content').innerHTML=`<div class="error">${esc(e&&e.message||e)}</div>`}
google.script.run.withSuccessHandler(s=>{isAdmin=s.isAdmin;$('account').textContent=s.email||'';if(isAdmin){$('adminBadge').style.display='inline-block';document.body.classList.add('admin-mode')}load()}).withFailureHandler(fail).getSessionInfo();
function load(){google.script.run.withSuccessHandler(data=>{all=data;buildFilters();render()}).withFailureHandler(fail).getStaffList()}
function buildFilters(){const cats=new Set;all.forEach(x=>String(x.categories).split('・').filter(Boolean).forEach(c=>cats.add(c)));$('filters').innerHTML=['すべて',...cats].map(c=>`<button class="chip ${c===category?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
function render(){const q=$('search').value.trim().toLowerCase();const rank={オーナー:0,事務長:1,一般担当者:2};const data=all.filter(x=>x.status===status&&(category==='すべて'||String(x.categories).split('・').includes(category))&&(!q||[x.store,x.storeCode,x.lastName,x.firstName,x.ryakusho,x.categories,x.details].join(' ').toLowerCase().includes(q))).sort((a,b)=>String(a.storeCode).localeCompare(String(b.storeCode),'ja',{numeric:true})||(rank[a.role]??2)-(rank[b.role]??2)||String(a.lastNameKana).localeCompare(String(b.lastNameKana),'ja'));if(!data.length){$('content').innerHTML='<div class="empty">該当する担当者はいません</div>';return}const groups={};data.forEach(x=>{const key=x.storeCode+'\u0000'+x.store;(groups[key]??=[]).push(x)});$('content').innerHTML=Object.entries(groups).map(([key,people])=>{const [code,store]=key.split('\u0000');return `<section class="store"><div class="store-head"><h2>🏠 ${esc(store)}</h2><span class="store-code">${esc(code)}</span><span class="count">${people.length}名</span></div><div class="cards">${people.map(card).join('')}</div></section>`}).join('')}
function card(x){const cats=String(x.categories).split('・').filter(Boolean);const valid=/^https:\/\//i.test(x.lineLink);const roleClass=x.role==='オーナー'?'role-owner':x.role==='事務長'?'role-chief':'';const badge=x.role==='オーナー'?'🏢 オーナー':x.role==='事務長'?'👑 事務長・店舗リーダー':'';return `<article class="card ${roleClass} ${valid?'has-line':''} ${x.status==='退社'?'retired':''}">${badge?`<div class="role-badge">${badge}</div>`:''}<div class="name">${esc(x.lastName)} ${esc(x.firstName)}</div><div class="kana">${esc(x.lastNameKana)} ${esc(x.firstNameKana)}</div><span class="short">${esc(x.ryakusho)}</span><div class="tags">${cats.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div>${x.details?`<div class="schedule">${esc(x.details)}</div>`:''}${x.schedule?`<div class="schedule">📅 ${esc(x.schedule)}</div>`:''}${x.status==='退社'?`<div class="retire-info">退社日: ${esc(x.retiredAt)}${isAdmin&&x.retiredBy?'<br>処理者: '+esc(x.retiredBy):''}</div>`:''}${valid?`<a class="line" href="${esc(x.lineLink)}" target="_blank" rel="noopener noreferrer">LINEで連絡</a>`:'<div class="line no-line">LINEリンクなし</div>'}${x.status==='在籍'?`<button class="admin-action retire" data-action="retire" data-id="${esc(x.id)}">退社にする</button>`:`<button class="admin-action restore" data-action="restore" data-id="${esc(x.id)}">在籍に戻す</button>`}</article>`}
$('search').addEventListener('input',render);document.addEventListener('click',e=>{const tab=e.target.closest('[data-status]');if(tab){status=tab.dataset.status;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));render();return}const chip=e.target.closest('[data-cat]');if(chip){category=chip.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===chip));render();return}const btn=e.target.closest('[data-action]');if(!btn||!isAdmin)return;const restoring=btn.dataset.action==='restore';if(!confirm(restoring?'この担当者を在籍に戻しますか？':'この担当者を退社に変更しますか？'))return;btn.disabled=true;const runner=google.script.run.withSuccessHandler(load).withFailureHandler(err=>{btn.disabled=false;alert(err.message||err)});restoring?runner.adminRestore(btn.dataset.id):runner.adminRetire(btn.dataset.id)});
</script></body></html>
